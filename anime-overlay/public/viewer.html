<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Live2D Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1020;
        color: #ddd;
        font-family: system-ui, Arial, sans-serif;
      }
      #layout {
        display: flex;
        height: 100%;
        width: 100%;
        background: linear-gradient(135deg, #111a33 0%, #0b1020 70%);
      }
      #sidebar {
        width: 300px;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
      }
      #tree {
        flex: 1;
        overflow: auto;
        padding: 8px;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #toolbar {
        padding: 18px 22px 14px;
        border-bottom: 1px solid rgba(160, 190, 255, 0.16);
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(16, 25, 50, 0.86);
        position: sticky;
        top: 0;
        z-index: 4;
      }
      #list {
        flex: 1;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 14px;
        padding: 16px 22px 22px;
        align-content: start;
      }
      .card {
        border: 1px solid rgba(160, 190, 255, 0.16);
        border-radius: 14px;
        padding: 0;
        cursor: pointer;
        overflow: hidden;
        background: rgba(24, 34, 64, 0.9);
        min-height: 250px;
      }
      .card:hover {
        border-color: #77a7ff;
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      }
      .model-card-preview {
        width: 100%;
        height: 180px;
        min-height: 180px;
        display: block;
        object-fit: contain;
        background: radial-gradient(circle at 50% 30%, #273a6b, #10172b 70%);
        color: #aaa;
        text-align: center;
        line-height: 180px;
      }
      .model-card-info {
        padding: 8px;
      }
      .model-card-name {
        color: #fff;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .model-card-path {
        color: #999;
        font-size: 11px;
        margin-top: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .model-card-variant {
        color: #75beff;
        font-size: 11px;
        margin-top: 3px;
      }
      #catalogHint {
        padding: 14px 22px 0;
        color: #aebce0;
        font-size: 13px;
      }
      .img-card {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 6px;
      }
      #stageWrap {
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 12, 27, 0.8);
        border-top: 1px solid rgba(160, 190, 255, 0.16);
      }
      #stage {
        width: 100%;
        height: 100%;
        display: flex;
      }
      .crumb a {
        color: #9cdcfe;
        text-decoration: none;
        margin-right: 4px;
      }
      #breadcrumb {
        color: #f4f7ff;
        font-size: 20px;
        font-weight: 700;
      }
      #backBtn {
        position: static !important;
        border: 0;
        border-radius: 9px;
        padding: 9px 18px;
        color: #081225;
        background: #9fc2ff;
        font-weight: 700;
        cursor: pointer;
      }
      #backBtn:hover {
        background: #c0d6ff;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
  </head>
  <body>
    <div id="layout">
      <div id="sidebar" style="display: none">
        <div
          style="padding: 8px; border-bottom: 1px solid #333; font-weight: 600"
        >
          Catalog
        </div>
        <div id="tree"></div>
      </div>
      <div id="main">
        <div id="toolbar">
          <div
            id="breadcrumb"
            class="crumb"
            style="flex: 1; overflow: auto; white-space: nowrap"
          >Live2dModels-ST-</div>

          <button style="position: absolute; bottom: 0" id="backBtn">
            Done
          </button>
        </div>
        <div id="catalogHint">Выберите модель для предпросмотра. Нажмите Done, чтобы оставить выбранную модель.</div>
        <div id="list"></div>
        <div id="stageWrap"><div id="stage"></div></div>
      </div>
    </div>

    <script src="../dist/renderer/viewer.js"></script>
  </body>
</html>
